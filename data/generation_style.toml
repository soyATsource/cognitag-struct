# 生成のスタイル定義。
#
# 【責務の分担】
# このファイルは「文の組み立て方」だけを扱う。
# どの要素を、どの順で、どの助詞で繋ぐか。
#
# 語彙の好みや関心の偏り（どの対象をよく話題にするか、どんな言い回しを
# 好むか）は mars_vault_writer/persona.toml に置く。両者を混ぜないこと。
# 組み立て方は文法の問題、語彙の好みは人格の問題であり、
# 変更する理由も頻度も異なる。

[general]
first_person = "私"
# 慣用句を使う頻度。常用すると人格として不自然になる。
# 規則ベースは前提条件を明示的に照合するので誤用はしないが、
# 頻度が高いと定型的に見える。
idiom_rate = 0.1


# --- verbosity 段階 ---------------------------------------------------
#
# 核となる文をまず作り、段階ごとに増分を足していく。
# どの段階で止めても文として成立する。
#
# 理解では周辺を削って核を取り出し、生成では核から周辺を足す。
# 同じ構造を逆向きに使うので、解析と生成で表現を共有できる。
#
# elements に書いた役割だけが出力される。書かれなかった役割は
# 捨てずに Utterance.withheld へ回り、後から問われたときに答えられる。
#
# 【cases を核に含める理由】
# 「名古屋に行く」の「名古屋に」は装飾ではなく命題の一部である。
# これを落とすと「行く」だけになり、文の意味が失われる。
# したがって主格以外の格スロットも verbosity 0 から出力する。

[verbosity.0]
# 核のみ。主格 + 格要素 + 述語。
elements = ["subject", "cases", "predicate"]
subject_particle = "が"

[verbosity.1]
# + 程度修飾
elements = ["subject", "cases", "degree", "predicate"]
subject_particle = "が"

[verbosity.2]
# + 時間主題
elements = ["subject", "topic", "cases", "degree", "predicate"]
subject_particle = "が"
topic_particle = "は"

# --- 応答の型 ---------------------------------------------------------
#
# chat.py が使う。発話の種類ごとに、どう返すかの文型を置く。
# ここもコードに直書きしないこと。
#
# {understood} は解析した内容を言い直したもの（generate の出力）。
# {question}   は埋まっていない必須スロットを尋ねる文（gap の出力）。
#
# 【答えられないことを隠さない】
# CogniTag は知識を持たない。辞書と構文だけで動くので、
# 「なぜ空が青いのか」には答えられない。答えられない旨をそのまま返す。
# もっともらしい嘘を作らないことが、この方式の取り柄である。

[reply]
# 挨拶。感動詞だけの発話。構造は無いが返せる。
greeting = "やあ。"
# 意志・勧誘・思案。「どうしよう」「何しようか」。
# 答えを出すのではなく、決めるのは本人だという立場で返す。
volition = "決めるのは君だ。"
# 疑問詞つきの問い。知識が要るので答えられない。
q_open = "それは私の知識では答えられない。{interrogative}を知る必要がある。"
# 肯否を問う。真偽の判断材料を持たない。
q_yesno = "その真偽は判断できない。私は辞書と構文しか持っていない。"
# 依頼。受領する。
request = "承知した。"
# 願望。受け止める。
desire = "そうしたいのだな。"
# 推量。保留する。
speculation = "かもしれないな。"
# 平叙で、必須スロットが埋まっている。理解した内容を言い直す。
statement = "{understood}、と理解した。"
# 平叙だが必須スロットが空。尋ねる。
statement_gap = "{question}"
# 構文解析ができなかった。
unparsable = "その文は構造として取れなかった。もっと短く言ってほしい。"
# 述語が無い、空入力など。
empty = "……"

# --- タグから引いた含意を添える形 -------------------------------------
#
# 「これは<X>だから<Y>だよね」の骨格。
# {reasoning} に reasoning.toml から引いた文が入る。
#
# 構造だけ返しても「理解した」で終わってしまう。何の話かをタグで括り、
# そのタグについて言えることを添えると、返答に中身が出る。
with_reasoning = "{reasoning}"
# 含意に加えて、埋まっていないスロットも尋ねる場合。
with_reasoning_gap = "{reasoning}。{question}"

# --- 会話の続き -------------------------------------------------------
#
# 直前に尋ねたことへの答えを受け取ったとき。
# 「どこに？」→「名古屋」→「名古屋に行くんだな」
# 埋め戻した構造をそのまま言い直すので、正しく受け取れたことが伝わる。
answered = "{understood}、ということだな。"
# 答えを受け取ったうえで、まだ言えることがある場合。
answered_with_reasoning = "{understood}、ということだな。{reasoning}"
# 指示語を直近の話題に置き換えたとき。
resolved = "{topic}のことだな。"


[verbosity.3]
# + 補足情報（数値など）を別文として追加。
# ここだけ主格を「が」ではなく読点で受ける。
# 補足が続く長い文では、読点の方が息継ぎとして自然になるため。
elements = ["subject", "topic", "cases", "degree", "predicate", "supplement"]
subject_particle = ""
subject_comma = true
topic_particle = "は"
supplement_separator = "。"
