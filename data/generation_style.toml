# 生成のスタイル定義。
#
# 【責務の分担】
# このファイルは「文の組み立て方」だけを扱う。
# どの要素を、どの順で、どの助詞で繋ぐか。
#
# 語彙の好みや関心の偏り（どの対象をよく話題にするか、どんな言い回しを
# 好むか）は mars_vault_writer/persona.toml に置く。両者を混ぜないこと。
# 組み立て方は文法の問題、語彙の好みは人格の問題であり、
# 変更する理由も頻度も異なる。

[general]
first_person = "私"
# 慣用句を使う頻度。常用すると人格として不自然になる。
# 規則ベースは前提条件を明示的に照合するので誤用はしないが、
# 頻度が高いと定型的に見える。
#
# なお chat.py は乱数ではなく「同じ句を二度使わない・二連続で使わない」で
# 頻度を抑えている。決定性を捨てないための選択で、この値は
# ライブラリとして idiom.maybe_choose_idiom() を直接使う場合の既定値。
idiom_rate = 0.1


# --- 慣用句 -----------------------------------------------------------
#
# 話題のタグから (form × content) のカテゴリを引き、前提条件を満たす句を
# 1 件選んで添える。カテゴリ辞書の検索と前提条件の照合はすべて既存の
# 部品（category_dict.members / idiom.choose_idiom）が行う。
#
# 【trigger は「話題 → カテゴリ」の対応】
# 「失敗した」から #困難 が立ち、それが content=失敗 のカテゴリを指す。
# ここに書いていないタグでは慣用句を引かない。引ける口を絞ることで、
# 場違いな引用が出る余地を無くしている。
#
# 【前提条件が満たせない句は出ない】
# 「猿も木から落ちる」は #熟練 を前提とする。相手が熟練者だと分かる
# 手立ては今のところ無いので、この句は出ない。出ないのが正しい。
[idiom]
# {surface} に句が入る。
template = "{surface}、っていうやつだね"

# --- 会話の口 → 応答の型 ----------------------------------------------
#
# タグが立ったら、構造の解析を待たずにこの型で返す。
# 上に書いたものが優先する（「すごい、なるほど」なら感嘆を採る）。
[reaction]
# 上に書いたものが優先する。細かい区別を先に見ないと、
# 「おつかれさま」が挨拶に飲まれて「はじめまして」と返る。
"#別れ" = "farewell"
"#労い" = "appreciation"
"#感謝" = "thanks"
"#挨拶" = "hail"
"#励まし" = "encouragement"
"#感嘆" = "exclamation"
"#相槌" = "backchannel"


[idiom.trigger]
# 引き口は狭くする。#困難 は迷う・悩む・壊れるまで含むので、
# ここに書くと「迷いました」に「二度あることは三度ある」が出る。
# 慣用句の照会には、そのために足した専用のタグだけを使う。
"#失敗" = "失敗"
"#成功" = "幸運"
"#無駄" = "無駄"
"#努力" = "努力"


# --- verbosity 段階 ---------------------------------------------------
#
# 核となる文をまず作り、段階ごとに増分を足していく。
# どの段階で止めても文として成立する。
#
# 理解では周辺を削って核を取り出し、生成では核から周辺を足す。
# 同じ構造を逆向きに使うので、解析と生成で表現を共有できる。
#
# elements に書いた役割だけが出力される。書かれなかった役割は
# 捨てずに Utterance.withheld へ回り、後から問われたときに答えられる。
#
# 【cases を核に含める理由】
# 「名古屋に行く」の「名古屋に」は装飾ではなく命題の一部である。
# これを落とすと「行く」だけになり、文の意味が失われる。
# したがって主格以外の格スロットも verbosity 0 から出力する。

[verbosity.0]
# 核のみ。主格 + 格要素 + 述語。
elements = ["subject", "cases", "predicate"]
subject_particle = "が"

[verbosity.1]
# + 程度修飾
elements = ["subject", "cases", "degree", "predicate"]
subject_particle = "が"

[verbosity.2]
# + 時間主題
elements = ["subject", "topic", "cases", "degree", "predicate"]
subject_particle = "が"
topic_particle = "は"

# --- 応答の型 ---------------------------------------------------------
#
# chat.py が使う。発話の種類ごとに、どう返すかの文型を置く。
# ここもコードに直書きしないこと。
#
# {understood} は解析した内容を言い直したもの（generate の出力）。
# {question}   は埋まっていない必須スロットを尋ねる文（gap の出力）。
#
# 【答えられないことを隠さない】
# CogniTag は知識を持たない。辞書と構文だけで動くので、
# 「なぜ空が青いのか」には答えられない。答えられない旨をそのまま返す。
# もっともらしい嘘を作らないことが、この方式の取り柄である。

[reply]
# 挨拶。感動詞だけの発話。構造は無いが返せる。
greeting = ["やあ。", "こんにちは。", "どうも。"]
# 意志・勧誘・思案。「どうしよう」「何しようか」。
# 答えを出すのではなく、決めるのは本人だという立場で返す。
volition = ["何に悩んでいるの？", "どうしたい？"]
# 疑問詞つきの問い。知識が要るので答えられない。
q_open = ["ごめん、{interrogative}は私には分からない。", "{interrogative}か。そこは私には答えられないな。"]
# 肯否を問う。真偽の判断材料を持たない。
# 答えられない理由は同じではないので、3 通りに言い分ける。
q_yesno = ["うーん、それは私には分からないな。", "そこは判断できないな。"]
# 天気・時刻・数量など、外界を見ないと分からないこと。
q_yesno_fact = ["外を見ないと分からないな。", "そこは調べないと分からないよ。"]
# 相手自身が決めること。「行きますか」「やりますか」。
q_yesno_volition = ["それは君が決めることだよ。", "そこは君しだいだね。"]
# 知識を差し出せと言われた場合。「教えて」「説明して」。
# 受領すると実行できない約束になるので、先に断る。
no_knowledge = ["何について？　分かる範囲なら答えるよ。", "何を知りたいのかな？"]
# 依頼。受領する。
request = ["わかった。", "了解。", "うん、いいよ。"]
# 願望。受け止める。
desire = ["そうなんだ。", "いいね。"]
# 推量。保留する。
speculation = ["かもね。", "そうかもしれないね。"]
# 平叙で、必須スロットが埋まっている。理解した内容を言い直す。
statement = ["{understood}、ということだね。"]
# 平叙だが必須スロットが空。尋ねる。
statement_gap = "{question}"
# 構文解析ができなかった。
unparsable = ["どうした？", "もう少し詳しく教えて。"]
# 名詞だけを言われたとき。その語について尋ねる。
about_noun = ["{noun}がどうしたの？", "{noun}か。それで？"]
# 直前に自分が言ったことを返す。作り直さず、そのまま引く。
recall = ["「{said}」って言ったよ。", "さっきは「{said}」だね。"]
recall_empty = "まだ何も言っていないよ。"
# 埋まっている語について、さらに尋ねる形。
specify = ["どんな{target}？", "何の{target}？"]
# 感情の原因を尋ねる形。
cause = ["何が{predicate}", "何かあった？"]
# 原因を尋ねない受け止め。疲れ・眠気など、理由を聞いても仕方ないもの。
no_cause_tags = ["#疲労", "#感覚"]
cause_bare = "何かあった？"
# 述語が無い、空入力など。
empty = "……"

# --- 会話の口への反応 -------------------------------------------------
#
# 「草」「なるほど」「おつ」は構造を持たない。述語が無いので格解析は
# 失敗するが、それは「取れなかった」と突き放す理由にはならない。
# 会話ではこの手の発話が多数を占める。
#
# 言い直しもしない。「すごい、と理解した」は返答として不自然である。
# 受け止めるだけの型を用意する。
# 一覧で書くと、同じ型を使うたびに順に切り替わる（chat.py の _template）。
# 乱数ではなく使用回数で選ぶので、同じ会話をやり直せば同じ結果になる。
#
# {focus} には、そのタグを立てた相手の語が入る。
# 「かわいいね」なら「かわいい」。取れなければ空になる。
backchannel = ["そうだね。", "そうなんだ。", "うん、それで？"]
exclamation = ["何を{focus}と感じたの？", "{focus}か。", "そうなんだ。"]
hail = ["はじめまして。これからよろしく。", "やあ。", "どうも。"]
farewell = ["また、明日！", "またね。", "じゃあ、またね。"]
appreciation = ["お疲れさま。今日はどのくらい進んだ？", "お疲れさま。", "お疲れさま。ゆっくり休んで。"]
encouragement = ["ありがとう。助かるよ。", "その言葉は効くね。", "ありがたい。"]
thanks = ["こちらこそ。", "どういたしまして。"]

# --- 辞書に無い述語への一般規則 ---------------------------------------
#
# 語彙を知らなくても、品詞と格の埋まり方までは分かる。
# そこまでを言って、足りない要素を尋ねる。何の話かは分からないので、
# 評価も助言もしない。分かったことだけを言う。
#
# {predicate} に述語の見出し語、{subject} {target} に格の中身が入る。
# 「〜、ということだな」の形にしてあるのは、活用を作らずに済むため。
# 「止んだ」「止みました」のどちらを入れても文になる。
felt = ["{predicate}んだね。何が？", "{predicate}の？　何が？"]
felt_about = ["{subject}が{predicate}、ということだね。", "{subject}についてそう感じているんだね。"]
did_to = ["{target}を{predicate}、ということだね。それで？", "{target}の話だね。"]
happened_to = ["{target}が{predicate}、ということだね。それで？", "{target}に起きたことか。それで？"]
happened = ["{predicate}、ということだね。何が？", "{predicate}んだね。何が？"]
identified = "{subject}は{predicate}、ということだね。"
identified_bare = "{predicate}の話だね。それで？"

# --- タグから引いた含意を添える形 -------------------------------------
#
# 「これは<X>だから<Y>だよね」の骨格。
# {reasoning} に reasoning.toml から引いた文が入る。
#
# 構造だけ返しても「理解した」で終わってしまう。何の話かをタグで括り、
# そのタグについて言えることを添えると、返答に中身が出る。
with_reasoning = "{reasoning}"
# 含意に加えて、埋まっていないスロットも尋ねる場合。
with_reasoning_gap = "{reasoning}。{question}"

# --- 会話の続き -------------------------------------------------------
#
# 直前に尋ねたことへの答えを受け取ったとき。
# 「どこに？」→「名古屋」→「名古屋に行くんだな」
# 埋め戻した構造をそのまま言い直すので、正しく受け取れたことが伝わる。
answered = "{understood}、ということだね。"
# 答えを受け取ったうえで、まだ言えることがある場合。
answered_with_reasoning = "{understood}、ということだね。"
# 指示語を直近の話題に置き換えたとき。
resolved = "{topic}のことだね。"


[verbosity.3]
# + 補足情報（数値など）を別文として追加。
# ここだけ主格を「が」ではなく読点で受ける。
# 補足が続く長い文では、読点の方が息継ぎとして自然になるため。
elements = ["subject", "topic", "cases", "degree", "predicate", "supplement"]
subject_particle = ""
subject_comma = true
topic_particle = "は"
supplement_separator = "。"
