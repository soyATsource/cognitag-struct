[lemma."下がる"]
GA = "何が？"

[lemma."降る"]
GA = "何が？"

[lemma."起こる"]
GA = "何が？"


# --- WO が人を指す述語 ------------------------------------------------

[lemma."待つ"]
WO = "誰を？"

[lemma."誘う"]
WO = "誰を？"

[lemma."呼ぶ"]
WO = "誰を？"


# --- KARA / WO が場所を指す述語 ---------------------------------------

[lemma."通る"]
WO = "どこを？"

[lemma."借りる"]
KARA = "誰から？"

[lemma."もらう"]
KARA = "誰から？"
