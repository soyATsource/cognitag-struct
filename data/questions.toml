# 空いているスロットを尋ねる文のテンプレート。
#
# コードに文言を書かないこと。ここを直せば口調を変えられる。
#
# [default] は格ごとの既定。[lemma."見出し語"] で述語ごとに上書きできる。
# TOML のベアキーは ASCII 英数のみなので、日本語のキーは必ず引用符で囲む。
#
# 【上書きが必要になる場面】
# 既定の「に」は場所を尋ねる「どこに？」だが、格の意味は述語によって変わる。
#   行く   → NI は行き先。       「どこに？」  ← 既定でよい
#   会う   → NI は相手。         「誰に？」    ← 上書きが必要
#   気づく → NI は気づいた対象。 「何に？」    ← 上書きが必要
# 既定で合う述語には何も書かない。書くのは既定が誤る場合だけにする。

[default]
GA   = "誰が？"
WO   = "何を？"
NI   = "どこに？"
HE   = "どこへ？"
KARA = "どこから？"
MADE = "どこまで？"


# --- NI が相手（人）を指す述語 ----------------------------------------

[lemma."会う"]
NI = "誰に？"

[lemma."連絡する"]
NI = "誰に？"

[lemma."相談する"]
NI = "誰に？"

[lemma."尋ねる"]
NI = "誰に？"


# --- NI が対象（物・事）を指す述語 ------------------------------------

[lemma."気づく"]
NI = "何に？"


# --- GA が物・事を指す述語（既定の「誰が？」だと誤る）-----------------

