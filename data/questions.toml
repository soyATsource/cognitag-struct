[lemma."終わる"]
GA = "何が？"

[lemma."始まる"]
GA = "何が？"

[lemma."増える"]
GA = "何が？"

[lemma."減る"]
GA = "何が？"

[lemma."変わる"]
GA = "何が？"

[lemma."続く"]
GA = "何が？"

[lemma."止まる"]
