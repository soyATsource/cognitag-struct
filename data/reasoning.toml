label = "仕事の話"
because = "期限と分担で決まる"
so = "何がいつまでで、誰の担当なのかが要る"

["#学習"]
ack = "そうなんだ。"
label = "学びの話"
so = "積み重ねが要る"

["#金銭"]
ack = "そうなんだ。"
label = "お金の話"
so = "額と期限がはっきりしないと決められない"

["#法制度"]
ack = "そうなんだ。"
label = "手続きの話"
so = "決まりと期限に従うほかない"

["#家族"]
ack = "そうなんだ。"
label = "家族の話"
so = "近いぶん、こじれると長引く"

# 怒りはつらさと分ける。宥めるのと寄り添うのは別の返し方になる。
["#怒り"]
suggest = "少し時間を置こう。"
ack = "落ち着いて。"
label = "腹の立つ話"
so = "何にどう腹が立ったのかで、できることが変わる"

# 句として登録した感情表現から立つタグ。
# form が「慣用句」であること自体は返答に出さない（分類の記録）。
["#慣用句"]
label = "言い回し"
so = ""

# 休息。勧める対象なので #生活 から分ける。
# 「休みたい」に「そうなんだ」で終えるより、後押しする方が望まれていた。
["#休息"]
suggest = "一旦休憩しよう。"
ack = "そうだね。"
label = "休みの話"
so = "先に体を戻した方が早い"
