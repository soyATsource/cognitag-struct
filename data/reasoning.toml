# --- モダニティ由来のタグ ---------------------------------------------
#
# 述語ではなく文の形から付くもの。上の内容タグと重なって出る。

["#仮定"]
label = "もしもの話"
because = "まだ起きていない"
so = "条件が揃うかどうかが先"

["#不確定"]
suggest = "決まってから動こう。"
label = "はっきりしない話"
so = "確かめる余地がある"

["#伝聞"]
label = "人から聞いた話"
because = "自分で確かめていない"
so = "出どころを知りたい"

["#否定"]
label = "そうではない話"
# 「しない方を選んだ」と書いていたが、これは意志を前提にしている。
# 「容量が足りない」「分からない」は選んだ結果ではない。
# 否定であることだけを言い、理由づけはしない。
so = "何がそうでないのかで話が変わる"

["#過去"]
label = "済んだ話"
so = "もう終わっている"

["#意志"]
label = "これからの話"
so = "決めるのは本人だ"

["#願望"]
label = "望みの話"
so = "そうなるといい"

# --- カテゴリ辞書（名詞の分野）由来 -----------------------------------
#
# 名詞から立つタグ。述語のタグより確度が低いので、含意も踏み込まない。
# 「何の話か」を言い当てるところまでにして、中身の判断はしない。
#
# ここに書かないタグ（#情報 #自然 #身体 #交通 #住居）は、分類には使うが
# 返答には出さない。「これは情報の話だな」と言われても相手には何の足しにも
# ならないためで、:trace には出るので分類が効いていることは確認できる。

["#健康"]
ack = "無理しないでね。"
label = "体調の話"
so = "無理を通す場面ではない"

["#食事"]
ack = "そうなんだ。"
label = "食べ物の話"
so = "好みと体調で決まる"

["#仕事"]
