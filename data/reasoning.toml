# タグから含意を引く表。
#
# 返答の「これは<X>だから<Y>だよね」の <Y> をここに置く。
# コードには一切書かない。ここを直せば返答の中身が変わる。
#
# 【なぜタグ経由にするか】
# 述語ごとに返答を書くと 118 通り必要になり、語を増やすたびに
# 返答も書かねばならない。タグ（#疲労 #移動 …）を挟めば、
# 語をいくら増やしても含意は 14 通りで済む。
# frames.jsonl にタグを 1 つ足すだけで返答が付いてくる。
#
# 【粗いままにしておく】
# 「#疲労なら休んだ方がいい」は雑な推論である。文脈によっては
# 外れる。それでも、当たり外れを人が読んで直せることに意味がある。
# LLM の出力は直せないが、この表は直せる。
#
# label   … 「これは<label>だ」と言うときの呼び名
# because … なぜそう言えるか（省略可）
# so      … だからどうなのか

# --- 状態・気分 -------------------------------------------------------

["#疲労"]
label = "疲れ"
because = "休息が足りていない"
so = "無理をしない方がいい"

["#感情"]
label = "気持ちの話"
so = "まず受け止めたい"

# 快と不快を分ける。共感と祝福では返し方が逆になる。
# 「つらい」に「よかった」と返したら台無しである。
["#つらさ"]
label = "しんどい話"
so = "正論より先に、そう感じたことを認めたい"

["#喜び"]
label = "よかった話"
so = "素直に喜んでいい"

# 名詞の種類から付くタグ。解析器が知っている区別。
["#場所"]
label = "場所の話"
so = "そこが起点か行き先かで意味が変わる"

["#人"]
label = "人の話"
so = "相手の都合がある"

["#時間"]
label = "時の話"
so = "いつなのかで段取りが変わる"

["#感覚"]
label = "体の感覚"
because = "本人にしか分からない"
so = "こちらから決めつけられない"

["#困難"]
label = "うまくいっていない話"
so = "何が引っかかっているかを知りたい"

["#達成"]
label = "うまくいった話"
so = "よかった"

# --- 行動 -------------------------------------------------------------

["#移動"]
label = "移動の話"
because = "行き先と時刻で決まる"
so = "どこへ、いつなのかが要る"

["#対人"]
label = "人が相手の話"
because = "相手の都合がある"
so = "相手が誰かで話が変わる"

["#伝達"]
label = "伝える話"
so = "誰に何を伝えるのかが要る"

["#作業"]
label = "作業の話"
because = "対象が決まらないと動けない"
so = "何に対してなのかが要る"

["#授受"]
label = "やり取りの話"
so = "誰と誰の間でなのかが要る"

["#生活"]
label = "暮らしの話"
so = "そういう時間も要る"

# --- 認識 -------------------------------------------------------------

["#思考"]
label = "考えごと"
because = "答えが出ていない"
so = "整理すると見えることがある"

["#変化"]
label = "変化の話"
because = "前と後で違う"
so = "何がどう変わったのかを見たい"

["#評価"]
label = "程度の話"
because = "比べる相手があって決まる"
so = "何と比べてなのかが要る"


# --- モダニティ由来のタグ ---------------------------------------------
#
# 述語ではなく文の形から付くもの。上の内容タグと重なって出る。

["#仮定"]
label = "もしもの話"
because = "まだ起きていない"
so = "条件が揃うかどうかが先"

["#不確定"]
label = "はっきりしない話"
so = "確かめる余地がある"

["#伝聞"]
label = "人から聞いた話"
because = "自分で確かめていない"
so = "出どころを知りたい"

["#否定"]
label = "しない話"
so = "しない方を選んだわけだ"

["#過去"]
label = "済んだ話"
so = "もう終わっている"

["#意志"]
label = "これからの話"
so = "決めるのは本人だ"

["#願望"]
label = "望みの話"
so = "そうなるといい"
