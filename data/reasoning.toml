# タグから含意を引く表。
#
# 返答の「これは<X>だから<Y>だよね」の <Y> をここに置く。
# コードには一切書かない。ここを直せば返答の中身が変わる。
#
# 【なぜタグ経由にするか】
# 述語ごとに返答を書くと 118 通り必要になり、語を増やすたびに
# 返答も書かねばならない。タグ（#疲労 #移動 …）を挟めば、
# 語をいくら増やしても含意は 14 通りで済む。
# frames.jsonl にタグを 1 つ足すだけで返答が付いてくる。
#
# 【粗いままにしておく】
# 「#疲労なら休んだ方がいい」は雑な推論である。文脈によっては
# 外れる。それでも、当たり外れを人が読んで直せることに意味がある。
# LLM の出力は直せないが、この表は直せる。
#
# label   … 「これは<label>だ」と言うときの呼び名
# because … なぜそう言えるか（省略可）
# so      … だからどうなのか

# --- 状態・気分 -------------------------------------------------------

["#疲労"]
suggest = "今日はもう休もう。"
ack = "お疲れさま。"
label = "疲れ"
because = "休息が足りていない"
so = "無理をしない方がいい"

["#感情"]
ack = "そうなんだ。"
label = "気持ちの話"
so = "まず受け止めたい"

# 快と不快を分ける。共感と祝福では返し方が逆になる。
# 「つらい」に「よかった」と返したら台無しである。
["#つらさ"]
ack = "大丈夫？"
label = "しんどい話"
so = "正論より先に、そう感じたことを認めたい"

["#喜び"]
ack = "それはいいね。"
label = "よかった話"
so = "素直に喜んでいい"

# 名詞の種類から付くタグ。解析器が知っている区別。
["#場所"]
label = "場所の話"
so = "そこが起点か行き先かで意味が変わる"

["#人"]
label = "人の話"
so = "相手の都合がある"

["#時間"]
label = "時の話"
so = "いつなのかで段取りが変わる"

["#感覚"]
ack = "そうなんだ。"
label = "体の感覚"
because = "本人にしか分からない"
so = "こちらから決めつけられない"

["#困難"]
suggest = "一つずつ片付けよう。"
ack = "それは大変だね。"
label = "うまくいっていない話"
so = "何が引っかかっているかを知りたい"

["#達成"]
ack = "よかったね。"
label = "うまくいった話"
so = "よかった"

