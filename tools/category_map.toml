# CogniTag_V2 辞書のカテゴリ名 → こちらの content 値 への対応表。
#
# 【何のための表か】
# V2 辞書の 11,980 語には 966 種類のカテゴリが付いている。ただしあれは
# 分類ではなく「コーパス上でその語が出現した全カテゴリ」の記録である。
# そのまま使うと 1 語に平均 10 個の無関係なカテゴリが付いてくる。
#
# そこでカテゴリ名の側を content 値へ寄せ、語ごとに多数決を取る。
# 実測では 966 カテゴリのうち約 300 が下のいずれかに写り、
# 残り 660（考古学・量子力学など）はどこにも写らずに捨てられる。
#
# 【日常語には効かない】
# 「会社」は 57 カテゴリ、「仕事」は 63 カテゴリに現れるので多数決が
# 割れる。この表が効くのは、出現するカテゴリが偏っている専門用語である。
# 日常語は tools/build_category_dict.py --mode sentence 側で集める。
#
# 【書き方】
# content 値 = ["カテゴリ名に含まれる語", ...]
# 部分一致。1 つでも当たればその content に 1 票入る。
# 広い語を書くと誤爆する（「用語」「表現」などは書かないこと）。

