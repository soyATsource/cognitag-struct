<svg xmlns="http://www.w3.org/2000/svg" width="680" height="726" viewBox="0 0 680 726" role="img">
<title>cognitag_struct の実行時の処理の流れ</title>
<desc>入力から返答までの 9 段階と、各段階が読むデータファイルを示した縦方向のフロー図</desc>
<style>
  .t{font-family:system-ui,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;fill:#1a1a1a}
  .th{font-family:system-ui,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;font-weight:500;fill:#1a1a1a}
  .ts{font-family:system-ui,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-size:12px;fill:#6b6b6b}
  .box{fill:#f5f4f2;stroke:#d4d2ce;stroke-width:.5}
  .amber{fill:#fdf2e0;stroke:#c8892a;stroke-width:.5}
  .amber+.th,.amber~.th{fill:#8a5c12}
  .teal{fill:#e6f2f0;stroke:#3f8f80;stroke-width:.5}
  .chip{font-family:system-ui,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-size:12px;fill:#2c6459}
  .arr{stroke:#8a8782;stroke-width:1.5;fill:none}
  .leader{stroke:#b5b2ad;stroke-width:.5;stroke-dasharray:3 3}
  @media (prefers-color-scheme:dark){
    .t,.th{fill:#e8e6e3}.ts{fill:#a3a3a3}
    .box{fill:#2a2a2a;stroke:#454545}
    .amber{fill:#3a2d15;stroke:#c8892a}.amber+.th,.amber~.th{fill:#f0c476}
    .teal{fill:#17342f;stroke:#4fa392}.chip{fill:#8fd4c4}
    .arr{stroke:#8a8782}.leader{stroke:#5a5a5a}
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8782" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="amber" x="60" y="50" width="320" height="36" rx="4"/><text class="th" x="80" y="73">入力「病院に行きます」</text>
<line class="arr" x1="220" y1="86" x2="220" y2="106" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="110" width="320" height="46" rx="4"/>
<text class="th" x="80" y="130">句照合</text><text class="ts" x="80" y="147">複数形態素の句だけ、最長一致</text>
<rect class="teal" x="420" y="115" width="220" height="36" rx="4"/><text class="chip" x="436" y="138">phrases.jsonl（句 2 件）</text>
<line class="leader" x1="382" y1="133" x2="418" y2="133"/>
<line class="arr" x1="220" y1="156" x2="220" y2="176" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="180" width="320" height="46" rx="4"/>
<text class="th" x="80" y="200">形態素分割とカテゴリ引き</text><text class="ts" x="80" y="217">1 形態素の語は分割の後に引く</text>
<rect class="teal" x="420" y="185" width="220" height="36" rx="4"/><text class="chip" x="436" y="208">phrases.jsonl（語 280 件）</text>
<line class="leader" x1="382" y1="203" x2="418" y2="203"/>
<line class="arr" x1="220" y1="226" x2="220" y2="246" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="250" width="320" height="46" rx="4"/>
<text class="th" x="80" y="270">モダリティ判定</text><text class="ts" x="80" y="287">文末から発話の種類。辞書に依存しない</text>
<line class="arr" x1="220" y1="296" x2="220" y2="316" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="320" width="320" height="46" rx="4"/>
<text class="th" x="80" y="340">格解析</text><text class="ts" x="80" y="357">が・を・に を格へ。2 節まで</text>
<rect class="teal" x="420" y="325" width="220" height="36" rx="4"/><text class="chip" x="436" y="348">frames.jsonl（136 語）</text>
<line class="leader" x1="382" y1="343" x2="418" y2="343"/>
<line class="arr" x1="220" y1="366" x2="220" y2="386" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="390" width="320" height="46" rx="4"/>
<text class="th" x="80" y="410">空きスロット検出</text><text class="ts" x="80" y="427">必須なのに空なら質問を作る</text>
<rect class="teal" x="420" y="395" width="220" height="36" rx="4"/><text class="chip" x="436" y="418">questions.toml</text>
<line class="leader" x1="382" y1="413" x2="418" y2="413"/>
<line class="arr" x1="220" y1="436" x2="220" y2="456" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="460" width="320" height="46" rx="4"/>
<text class="th" x="80" y="480">タグ収集と含意</text><text class="ts" x="80" y="497">述語・名詞・文型・素性の 4 系統</text>
<rect class="teal" x="420" y="465" width="220" height="36" rx="4"/><text class="chip" x="436" y="488">reasoning.toml（33 件）</text>
<line class="leader" x1="382" y1="483" x2="418" y2="483"/>
<line class="arr" x1="220" y1="506" x2="220" y2="526" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="530" width="320" height="46" rx="4"/>
<text class="th" x="80" y="550">応答方針の決定</text><text class="ts" x="80" y="567">16 の型から 1 つ選ぶ</text>
<rect class="teal" x="420" y="535" width="220" height="36" rx="4"/><text class="chip" x="436" y="558">generation_style.toml</text>
<line class="leader" x1="382" y1="553" x2="418" y2="553"/>
<line class="arr" x1="220" y1="576" x2="220" y2="596" marker-end="url(#arrow)"/>

<rect class="box" x="60" y="600" width="320" height="46" rx="4"/>
<text class="th" x="80" y="620">慣用句を添える</text><text class="ts" x="80" y="637">カテゴリ → 前提で絞る → 1 件</text>
<rect class="teal" x="420" y="605" width="220" height="36" rx="4"/><text class="chip" x="436" y="628">phrases.jsonl（ことわざ 8 件）</text>
<line class="leader" x1="382" y1="623" x2="418" y2="623"/>
<line class="arr" x1="220" y1="646" x2="220" y2="666" marker-end="url(#arrow)"/>

<rect class="amber" x="60" y="670" width="320" height="36" rx="4"/><text class="th" x="80" y="693">返答</text>
</svg>
